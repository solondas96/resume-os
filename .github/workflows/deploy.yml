name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests with the coverage gate (90% lines in intelligence and model)
        run: npm run test:coverage

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e
        env:
          CI: true

      - name: Build project
        run: npm run build

      - name: Note what the e2e run left behind
        if: always()
        run: |
          echo "::notice title=after e2e::test-results: $(ls test-results 2>&1 | tr '\n' ' ') | cwd: $PWD"
          echo "::notice title=e2e list::$(npx playwright test --list 2>&1 | tail -1)"

      - name: First-screen timing on Fast 3G with 4x CPU (2.5 s budget)
        run: npm run perf

      - name: Offline (PWA) tests against the production build
        env:
          CI: true
        run: |
          set +e
          npm run e2e:pwa > pwa.log 2>&1
          status=$?
          # The log is not public; its key lines are, as an annotation
          echo "::notice title=offline test lines::$(grep -E 'Error|expected|Offline start|pageerror|error:' pwa.log | head -c 1500 | tr '\n' ' ' | sed 's/::/: /g')"
          cat pwa.log
          exit $status

      - name: Bundle size budget (initial JavaScript, 300 KB gzipped)
        run: npm run size

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        id: pages-upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Refuse to deploy without the Pages artifact
        if: steps.pages-upload.outcome != 'success'
        run: |
          echo "::error title=No Pages artifact::The Pages artifact was not uploaded, so nothing was deployed. Look at the 'Upload artifact' step."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages-upload.outcome == 'success'
        uses: actions/deploy-pages@v4

      - name: Smoke check the live site (app root and version)
        if: steps.deployment.outcome == 'success'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          EXPECTED=$(node -p "require('./package.json').version")
          echo "Live URL: $PAGE_URL  expected version: $EXPECTED"
          for i in $(seq 1 12); do
            HTML=$(curl -fsSL "$PAGE_URL" || true)
            VER=$(curl -fsSL "${PAGE_URL}version.json" 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || true)
            ROOT=$(echo "$HTML" | grep -c 'id="root"' || true)
            if [ "$ROOT" -ge 1 ] && [ "$VER" = "$EXPECTED" ]; then
              echo "Smoke check passed: app root present, live version $VER"
              exit 0
            fi
            echo "Attempt $i: app root found=$ROOT, live version=$VER (want $EXPECTED). Waiting."
            sleep 10
          done
          echo "::error title=Smoke check failed::$PAGE_URL did not serve version $EXPECTED with the app root."
          exit 1

      - name: List the visual check files
        if: always()
        run: |
          echo "::notice title=visual check files::$(ls test-results/visual 2>&1 | tr '\n' ' ')"
          echo "::notice title=screenshot files::$(ls test-results/screenshots 2>&1 | tr '\n' ' ')"
          echo "::notice title=walkthrough::$(ls test-results/walkthrough.json 2>&1)"

      - name: Upload visual check (PDF page 1 next to the preview)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-pdf-check
          path: test-results/visual/
          if-no-files-found: warn

      - name: Render every page of the two-page résumés (page-break pictures)
        if: always()
        run: RENDER_PAGES=1 npx vitest run src/pdf/pagebreaks.test.ts -t "every page, as pictures"

      - name: Upload screenshots and the walkthrough report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-and-walkthrough
          path: |
            test-results/screenshots/
            test-results/walkthrough.json
            test-results/page-breaks/
            test-results-viewports/
          if-no-files-found: warn
