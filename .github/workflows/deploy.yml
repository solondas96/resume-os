name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests with the coverage gate (90% lines in intelligence and model)
        run: npm run test:coverage

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e
        env:
          CI: true

      - name: Build project
        run: npm run build

      - name: First-screen timing on Fast 3G with 4x CPU (2.5 s budget)
        run: npm run perf

      - name: Offline (PWA) tests against the production build
        run: npm run e2e:pwa
        env:
          CI: true

      - name: Bundle size budget (initial JavaScript, 300 KB gzipped)
        run: npm run size

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: List the visual check files
        if: always()
        run: ls -la test-results/visual || echo 'no visual check files'

      - name: Upload visual check (PDF page 1 next to the preview)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-pdf-check
          path: test-results/visual/
          if-no-files-found: ignore

      - name: Upload screenshots and the walkthrough report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-and-walkthrough
          path: |
            test-results/screenshots/
            test-results/walkthrough.json
          if-no-files-found: ignore
